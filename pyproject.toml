[project]
name = "email-audit"
version = "0.3.0"
description = "Lightweight email security assessment tool"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Charalampos Spanias" }
]

dependencies = [
    "rich>=13.0.0"
]

keywords = [
    "security",
    "email",
    "spf",
    "dkim",
    "dmarc",
    "mta-sts"
]

[project.scripts]
email-audit = "email_audit:main"