[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "email-audit"
version = "1.0.0"
description = "Lightweight email security assessment tool"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Charalampos Spanias" }
]

dependencies = [
    "rich>=13.0.0",
    "rich-argparse>=1.7.1",
    "PyYAML>=6.0",
    "Markdown>=3.4",
    "cryptography>=41.0",
    "dnspython>=2.4",
]

keywords = [
    "security",
    "email",
    "spf",
    "dkim",
    "dmarc",
    "mta-sts"
]

[project.scripts]
email-audit = "email_audit.cli:main"

[project.optional-dependencies]
docs = ["mkdocs-material"]

[tool.setuptools.packages.find]
include = ["email_audit", "email_audit.*"]

[tool.setuptools.package-data]
email_audit = ["data/*.yaml"]